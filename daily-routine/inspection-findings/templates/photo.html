<!doctype html>
<html><head><meta charset="utf-8">
<!-- One tech photo, stamped with the address and the post's date and time. Filled by render.js. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{width}}px; height: {{height}}px; overflow: hidden; background: #000; }
  img { display: block; width: {{width}}px; height: {{height}}px; }
  .stamp { position: absolute; left: 0; right: 0; bottom: 0; padding: {{pad}}px {{padX}}px; background: linear-gradient(transparent, rgba(0,0,0,.72) 38%); color: #fff; font-family: Arial, "Liberation Sans", sans-serif; font-size: {{font}}px; line-height: 1.3; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .stamp b { display: block; font-size: {{fontBig}}px; }
</style></head>
<body><img src="{{src}}" alt=""><div class="stamp"><b>{{address}}</b>{{when}}</div></body></html>
