<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Quote card picture for the text: 1080x1350, filled by render.js from quote.json. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #ffffff;
    color: #0E120E;
    font-family: Arial, Helvetica, "Liberation Sans", sans-serif;
    display: flex;
    flex-direction: column;
  }
  .heavy { font-family: "Arial Black", "Arial Bold", Arial, Helvetica, "Liberation Sans", sans-serif; font-weight: 900; }
  header { padding: 50px 72px 0; }
  header img { height: 150px; display: block; }
  .rule { margin: 32px 72px 0; height: 8px; border-radius: 4px; background: #15BA0D; width: 132px; }
  .intro { padding: 28px 72px 0; }
  h1 { font-size: 74px; line-height: 1.04; letter-spacing: -1px; }
  .address { margin-top: 12px; font-size: 36px; line-height: 1.25; color: #4A554B; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding: 30px 72px 34px; }
  .badge {
    align-self: flex-start;
    background: #15BA0D;
    color: #0E120E;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.2;
    padding: 13px 28px;
    border-radius: 999px;
    text-wrap: balance;
  }
  .option { background: #EEF1EE; border-radius: 30px; padding: 30px 46px 34px; border-left: 14px solid #15BA0D; }
  .label { font-size: 26px; font-weight: 700; letter-spacing: 4px; color: #11960B; text-transform: uppercase; }
  .name { margin-top: 6px; font-size: 46px; font-weight: 700; line-height: 1.15; }
  .row { margin-top: 14px; display: flex; align-items: center; gap: 36px; }
  .prices { display: flex; flex-direction: column; flex-shrink: 0; }
  .was { font-size: 38px; color: #6B756C; text-decoration: line-through; text-decoration-thickness: 4px; line-height: 1; margin-bottom: 6px; }
  .price { font-size: 124px; line-height: 0.92; letter-spacing: -3px; }
  .line { font-size: 34px; line-height: 1.3; color: #333B34; }
  footer {
    background: #0E120E;
    color: #ffffff;
    padding: 36px 56px 40px;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    white-space: nowrap;
  }
  footer .dot { font-size: 24px; }
  footer .dot { color: #15BA0D; }
  footer .phone { white-space: nowrap; }
  /* render.js adds .compact when the normal layout overflows (long names, discount). */
  .compact header { padding-top: 40px; }
  .compact header img { height: 124px; }
  .compact .rule { margin-top: 26px; }
  .compact h1 { font-size: 66px; }
  .compact .address { font-size: 32px; }
  .compact main { gap: 20px; padding: 24px 72px 26px; }
  .compact .option { padding: 24px 42px 28px; }
  .compact .name { font-size: 42px; }
  .compact .price { font-size: 112px; }
  .compact .line { font-size: 32px; }
  /* One option only: give it more room. */
  .single .option { padding: 48px 52px 54px; }
  .single .price { font-size: 150px; }
</style>
</head>
<body>
  <header><img src="{{logoUrl}}" alt="Catchy Pest Solutions"></header>
  <div class="rule"></div>
  <section class="intro">
    <h1 class="heavy">{{title}}</h1>
    {{#serviceAddress}}<p class="address">{{serviceAddress}}</p>{{/serviceAddress}}
  </section>
  <main class="{{layout}}">
    {{#discountBadge}}<div class="badge">{{discountBadge}}</div>{{/discountBadge}}
    {{#options}}
    <div class="option">
      <div class="label">{{label}}</div>
      <div class="name">{{name}}</div>
      <div class="row">
        <div class="prices">
          {{#wasPrice}}<span class="was">{{wasPrice}}</span>{{/wasPrice}}
          <span class="price heavy">{{price}}</span>
        </div>
        <div class="line">{{cardLine}}</div>
      </div>
    </div>
    {{/options}}
  </main>
  <footer>
    <span>Reply with the day that works</span><span class="dot">&#9679;</span><span class="phone">{{officePhone}}</span>
  </footer>
</body>
</html>
